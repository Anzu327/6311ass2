name: Meme browser QA
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: meme-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - name: Use official HTTPS Ubuntu mirrors
        run: |
          for aptConfig in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$aptConfig" ]; then
              sudo sed -i -E 's#http://(azure[.]archive|archive|security)[.]ubuntu[.]com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' "$aptConfig"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-feed-transition.mjs
      - run: node scripts/check-meme-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-overlay-browser-qa
          path: qa-results/
          retention-days: 7
